name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: bash -n
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: shellcheck
        run: |
          shellcheck --version
          find . -name '*.sh' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            (cd "$(dirname "$f")" && shellcheck -x "$(basename "$f")") || exit 1
          done
      - name: recipe metadata
        run: |
          python3 -m py_compile lib/recipe-meta.py
          for f in apps/*/recipe.json; do python3 -m json.tool "$f" >/dev/null; done
          python3 lib/recipe-meta.py list apps
